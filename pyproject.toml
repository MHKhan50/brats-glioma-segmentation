[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brats-glioma-segmentation"
version = "0.1.0"
description = "3D U-Net vs SwinUNETR for adult glioma segmentation on BraTS 2023 (BraTS-GLI), evaluated in native space"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain", email = "muzammal@masmatixinnovations.co.uk"}]
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
train = ["torch>=2.1", "monai>=1.3", "nibabel>=5.0", "synapseclient>=4.0"]
dev = ["pytest>=7.4"]

[project.scripts]
brats-seg = "brats_seg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
